<!DOCTYPE html>
<!--
     _____  _      _     _______      __
    |  __ \(_)    | |   / ____\ \    / /
    | |__) |_  ___| | _| |     \ \  / /
    |  _  /| |/ __| |/ / |      \ \/ /
    | | \ \| | (__|   <| |____   \  /
    |_|  \_\_|\___|_|\_\\_____|   \/   [rɪk-si-vi]

    RickCV Builder – Lebenslauf und Anschreiben im Browser bauen.
    Reines HTML/CSS/JS ohne Abhaengigkeiten: laesst sich als statische
    Seite hosten und funktioniert auch lokal per Doppelklick.
-->
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>RickCV | Resume builder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Create your resume and cover letter right in your browser. No sign-up required."
    />
    <link rel="stylesheet" href="fonts/fonts.css" />
    <link rel="stylesheet" href="builder.css" />
  </head>
  <body>
    <!--  Kopfzeile und Reiter bilden auf dem Telefon einen Block, der beim
          Scrollen als Ganzes hinausfaehrt. Auf breiten Bildschirmen reicht
          display:contents die beiden unveraendert an <body> durch. -->
    <div class="app-chrome" id="app-chrome">
      <header class="app-header">
        <div class="brand">RickCV <small id="brand-tagline">Resume builder</small></div>

        <div class="header-spacer"></div>

        <div class="header-actions">
          <select class="header-select" id="lang-switch" aria-label="Sprache">
            <option value="de">Deutsch</option>
            <option value="en">English</option>
          </select>
          <button class="btn btn-icon btn-theme" id="btn-theme" type="button">
            <span class="material-symbols-outlined" id="btn-theme-icon" aria-hidden="true"
              >contrast</span
            >
          </button>

          <span class="header-divider" aria-hidden="true"></span>

          <button class="btn btn-icon" id="btn-undo" type="button" data-icon="undo" disabled>
            <span class="btn-glyph" aria-hidden="true"></span>
          </button>
          <button class="btn" id="btn-example" data-icon="sparkles">
            <span class="btn-glyph" aria-hidden="true"></span><span class="btn-label">Beispiel</span>
          </button>
          <button class="btn" id="btn-reset" data-icon="file-plus">
            <span class="btn-glyph" aria-hidden="true"></span><span class="btn-label">Neu</span>
          </button>
          <button class="btn" id="btn-import" data-icon="upload">
            <span class="btn-glyph" aria-hidden="true"></span><span class="btn-label">Importieren</span>
          </button>
          <button class="btn" id="btn-export" data-icon="download" aria-haspopup="menu">
            <span class="btn-glyph" aria-hidden="true"></span><span class="btn-label">Speichern</span>
          </button>
          <button class="btn" id="btn-open" data-icon="external-link">
            <span class="btn-glyph" aria-hidden="true"></span><span class="btn-label">Neuer Tab</span>
          </button>
          <button class="btn btn-primary" id="btn-print" data-icon="printer">
            <span class="btn-glyph" aria-hidden="true"></span><span class="btn-label">Als PDF speichern</span>
          </button>
        </div>
      </header>

      <nav class="mobile-tabs">
        <button class="btn" id="tab-edit" type="button" aria-pressed="true">Bearbeiten</button>
        <button class="btn" id="tab-preview" type="button" aria-pressed="false">Vorschau</button>
      </nav>
    </div>

    <main class="app-main">
      <!--  Die Schiene traegt beide Spalten nebeneinander. Auf breiten
            Bildschirmen ist sie per display:contents unsichtbar, auf
            schmalen wird sie doppelt so breit wie der Rahmen und laesst
            sich verschieben – dazu muss der Rahmen sie beschneiden. -->
      <div class="app-track">
        <aside class="editor-pane">
          <div class="editor" id="editor"></div>

          <footer class="app-footer">
            <span class="app-footer-note" id="footer-note"
              >Alle Daten bleiben in deinem Browser.</span
            >

            <nav class="app-footer-links" aria-label="Rechtliches und Quellen">
              <a href="legal.html#impressum" id="footer-imprint">Impressum</a>
              <a href="legal.html#datenschutz" id="footer-privacy">Datenschutz</a>
              <a
                href="https://github.com/rickintoplace/RickCV"
                id="footer-source"
                target="_blank"
                rel="noopener noreferrer"
                >Quellcode</a
              >
              <a href="https://rickinto.place/" target="_blank" rel="noopener noreferrer"
                >rickinto.place</a
              >
            </nav>
          </footer>
        </aside>

        <div class="resizer" id="resizer"></div>

        <section class="preview">
          <div class="preview-bar" id="preview-bar">
            <label for="zoom" id="zoom-label">Zoom</label>
            <select id="zoom">
              <option value="fit">Einpassen</option>
              <option value="0.5">50 %</option>
              <option value="0.75">75 %</option>
              <option value="1">100 %</option>
            </select>
            <span class="page-count" id="page-count"></span>
            <span class="browser-warn" id="browser-warn" hidden></span>
            <span class="status" id="status">Bereit</span>
          </div>

          <div class="preview-scroll" id="preview-scroll">
            <div class="preview-canvas" id="preview-canvas">
              <div class="preview-stage" id="preview-stage">
                <iframe id="preview-frame" src="cv.html" title="Vorschau"></iframe>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="js/i18n.js"></script>
    <script src="js/icon-data.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/icon-picker.js"></script>
    <script src="js/theme-data.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/model.js"></script>
    <script src="js/ats.js"></script>
    <script src="js/render.js"></script>
    <script src="js/fields.js"></script>
    <script src="js/sections.js"></script>
    <!--  Import: die Formate selbst, der Dialog davor und – nur bei Bedarf
          nachgeladen – die PDF-Unterstuetzung aus vendor/pdfjs/.  -->
    <script src="js/import.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/pdf-import.js"></script>
    <script src="js/docx-import.js"></script>
    <script src="js/import-dialog.js"></script>
    <script src="js/builder.js"></script>
  </body>
</html>
