    RickCV Builder – Lebenslauf und Anschreiben im Browser bauen.
    Reines HTML/CSS/JS ohne Abhaengigkeiten: laesst sich als statische
    Seite hosten und funktioniert auch lokal per Doppelklick.
-->
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>RickCV – Lebenslauf-Baukasten</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Lebenslauf und Anschreiben im Browser erstellen – mit Live-Vorschau und PDF-Export. Ohne Anmeldung, alle Daten bleiben auf deinem Gerät."
    />
    <link rel="stylesheet" href="builder.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">RickCV <small>Lebenslauf-Baukasten</small></div>

      <div class="header-spacer"></div>

      <div class="header-actions">
        <button class="btn" id="btn-example" title="Beispieldaten laden">
          Beispiel
        </button>
        <button class="btn" id="btn-reset" title="Leer neu beginnen">Neu</button>
        <button class="btn" id="btn-import" title="Gespeicherte JSON-Datei laden">
          Importieren
        </button>
        <button class="btn" id="btn-export" title="Daten als JSON sichern">
          Exportieren
        </button>
        <button class="btn" id="btn-open" title="Dokument in neuem Tab öffnen">
          Neuer Tab
        </button>
        <button class="btn btn-primary" id="btn-print" title="Als PDF speichern">
          Als PDF speichern
        </button>
      </div>
    </header>

    <nav class="mobile-tabs">
      <button class="btn" id="tab-edit">Bearbeiten</button>
      <button class="btn" id="tab-preview">Vorschau</button>
    </nav>

    <main class="app-main">
      <aside class="editor" id="editor"></aside>
      <div class="resizer" id="resizer" title="Breite ziehen"></div>

      <section class="preview">
        <div class="preview-bar">
          <label for="zoom">Zoom</label>
          <select id="zoom">
            <option value="fit">Einpassen</option>
            <option value="0.5">50 %</option>
            <option value="0.75">75 %</option>
            <option value="1">100 %</option>
          </select>
          <span class="status" id="status">Bereit</span>
        </div>

        <div class="preview-scroll" id="preview-scroll">
          <div class="preview-canvas" id="preview-canvas">
            <div class="preview-stage" id="preview-stage">
              <iframe
                id="preview-frame"
                src="cv.html"
                title="Vorschau des Lebenslaufs"
              ></iframe>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div class="toast" id="toast"></div>
    <datalist id="material-icons"></datalist>
    <input type="file" id="import-file" accept="application/json,.json" hidden />

    <script src="defaults.js"></script>
    <script src="render.js"></script>
    <script src="builder.js"></script>
  </body>
</html>
