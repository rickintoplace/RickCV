# Alle Tests bei jedem Push und jedem Pull Request.
#
# Die Browser-Tests brauchen ein Chromium. Auf den Ubuntu-Maschinen von
# GitHub ist Google Chrome vorinstalliert; tests/chromium.mjs findet es im
# PATH. REQUIRE_BROWSER sorgt dafuer, dass ein fehlendes Chromium ein Fehler
# ist – sonst liefen die Browser-Tests hier stillschweigend nicht, und die
# Leiste waere trotzdem gruen.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Chromium vorhanden
        run: google-chrome --version

      - name: Datenmodell, Migration, Verlauf
        run: node tests/model.test.mjs
      - name: Import
        run: node tests/import.test.mjs
      - name: Theme-Vertrag
        run: node tests/theme.test.mjs
      - name: Baukasten im Browser
        run: node tests/app.test.mjs
      - name: Rundlauf Druck und Import
        run: node tests/roundtrip.test.mjs
