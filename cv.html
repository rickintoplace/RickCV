<!DOCTYPE html>
<!--
    cv.html – das eigentliche Dokument (Lebenslauf, Anschreiben, Textfassung).

    Laeuft im Vorschaurahmen des Builders und wird per postMessage befuellt.
    Direkt geoeffnet zeigt es den zuletzt gespeicherten Stand.
-->
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Lebenslauf</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="fonts/fonts.css" />
    <style>
      /* Im Vorschaurahmen stehen die Seiten untereinander. */
      body {
        background: #c4c4c4;
      }
      .document {
        flex-direction: column;
        align-items: center;
        gap: 24px;
        padding: 24px 0;
      }
      .resume_wrapper,
      .cover-letter_wrapper,
      .ats-appendix_wrapper {
        margin: 0 !important;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
        flex-shrink: 0;
      }
      @media print {
        body {
          background: #fff;
        }
        .document {
          gap: 0;
          padding: 0;
        }
        .resume_wrapper,
        .cover-letter_wrapper,
        .ats-appendix_wrapper {
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="document"></div>

    <script src="js/i18n.js"></script>
    <script src="js/icon-data.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/model.js"></script>
    <script src="js/ats.js"></script>
    <script src="js/render.js"></script>
    <script>
      (function () {
        "use strict";
        var STORAGE_KEY = "rickcv.data.v3";
        var LEGACY_KEY = "rickcv.data.v2";
        var PAGE_HEIGHT_CM = 29.7;

        function paint(data) {
          try {
            RickCVRender.render(document, data);
          } catch (error) {
            console.error("RickCV Render-Fehler:", error);
            parent.postMessage(
              { type: "rickcv:error", message: String(error && error.message) },
              "*"
            );
          }
        }

        //  Die Seitenzahl wird aus der tatsaechlichen Hoehe der Bloecke
        //  berechnet – der Builder zeigt sie neben dem Zoom an.
        function countPages() {
          var perPage = (PAGE_HEIGHT_CM / 2.54) * 96; // cm -> px bei 96 dpi
          var pages = 0;
          document.querySelectorAll(
            ".resume_wrapper, .cover-letter_wrapper, .ats-appendix_wrapper"
          ).forEach(function (block) {
            pages += Math.max(1, Math.ceil(block.offsetHeight / perPage - 0.02));
          });
          return pages || 1;
        }

        //  Hoehe und Seitenzahl erzwingen ein Layout. Das kostet, also wird
        //  bei mehreren Renderdurchgaengen kurz hintereinander nur einmal
        //  gemessen – gezeichnet wird trotzdem sofort.
        var reportQueued = false;
        function scheduleReport() {
          if (reportQueued) return;
          reportQueued = true;
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              reportQueued = false;
              report();
            });
          });
        }

        function report() {
          parent.postMessage(
            {
              type: "rickcv:height",
              height: document.documentElement.scrollHeight,
              pages: countPages(),
            },
            "*"
          );
        }

        window.addEventListener("message", function (event) {
          var message = event.data;
          if (!message || typeof message !== "object") return;

          if (message.type === "rickcv:data") {
            paint(message.data);
            scheduleReport();
          } else if (message.type === "rickcv:print") {
            window.focus();
            window.print();
          }
        });

        // Direktaufruf: gespeicherten Stand oder Beispiel zeigen.
        var initial = null;
        try {
          var stored =
            localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_KEY);
          if (stored) initial = RickCVModel.migrate(JSON.parse(stored));
        } catch (error) {
          /* kein Speicher verfuegbar – dann eben das Beispiel */
        }
        paint(initial || RickCVModel.createExample("de"));

        window.addEventListener("load", report);
        parent.postMessage({ type: "rickcv:ready" }, "*");
      })();
    </script>
  </body>
</html>
