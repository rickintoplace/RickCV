<!DOCTYPE html>
<!--
    cv.html – das eigentliche Dokument (Lebenslauf, Anschreiben, Textfassung).

    Laeuft im Vorschaurahmen des Builders und wird per postMessage befuellt
    (js/preview.js). Direkt geoeffnet zeigt es den zuletzt gespeicherten Stand.
-->
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <!--  Was dieses Dokument laden darf: Skripte, Schriften und Bilder von
          der eigenen Adresse, Bilder und Schriften auch als data:. Kein
          Theme und kein importiertes Dokument kann damit etwas aus dem
          Netz holen oder ein Skript einschleusen. Inline-Stile bleiben
          erlaubt: das Theme ist ein <style>, und der Renderer setzt Masse
          als style-Attribut. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>Lebenslauf</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="fonts/fonts.css" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* Im Vorschaurahmen stehen die Seiten untereinander. */
      body {
        background: #c4c4c4;
      }
      .document {
        flex-direction: column;
        align-items: center;
        gap: 24px;
        padding: 24px 0;
      }
      .resume_wrapper,
      .cover-letter_wrapper,
      .ats-appendix_wrapper {
        margin: 0 !important;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
        flex-shrink: 0;
      }
      /*  Umrandung und Knopf, mit denen die Vorschau in den Editor fuehrt
          (js/preview.js). Sie stehen ausserhalb der Kaskadenebenen und
          gewinnen damit gegen jedes Theme – und sie gehoeren nie ins PDF. */
      .rickcv-edit-frame {
        position: absolute;
        z-index: 1000;
        border: 2px solid rgba(40, 111, 111, 0.55);
        border-radius: 6px;
        background: rgba(40, 111, 111, 0.05);
        pointer-events: none;
      }
      .rickcv-edit-button {
        position: absolute;
        z-index: 1001;
        margin: 0;
        padding: 3px 9px 3px 8px;
        border: 0;
        border-radius: 6px 6px 0 6px;
        background: #286f6f;
        color: #fff;
        font: 600 12px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0;
        text-transform: none;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
      }
      .rickcv-edit-button:hover {
        background: #1f5a5a;
      }
      .rickcv-edit-frame[hidden],
      .rickcv-edit-button[hidden] {
        display: none;
      }
      @media print {
        .rickcv-edit-frame,
        .rickcv-edit-button {
          display: none !important;
        }
        body {
          background: #fff;
        }
        .document {
          gap: 0;
          padding: 0;
        }
        .resume_wrapper,
        .cover-letter_wrapper,
        .ats-appendix_wrapper {
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="document"></div>

    <script src="js/i18n.js"></script>
    <script src="js/icon-data.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/theme-data.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/model.js"></script>
    <script src="js/ats.js"></script>
    <script src="js/render.js"></script>
    <script src="js/preview.js"></script>
  </body>
</html>
